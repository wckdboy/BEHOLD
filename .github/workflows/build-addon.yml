name: Build add-on zip

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: make zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: behold-addon
          path: dist/behold-*.zip
          if-no-files-found: error
