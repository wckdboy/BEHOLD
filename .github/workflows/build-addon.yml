name: Build Blender add-on zip

on:
  push:
    branches: [main, master, "cursor/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    name: Build install zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests
        run: make test

      - name: Build zip
        run: make zip

      - name: List suite zips
        run: |
          set -euo pipefail
          ls -1 dist/behold-studio-*.zip dist/behold-lighting-*.zip dist/behold-product-*.zip dist/behold-utilities-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: behold-addon
          path: dist/behold-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/behold-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
